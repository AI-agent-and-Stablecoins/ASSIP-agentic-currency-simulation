[project]
name = "assip-future-of-finance"
version = "0.1.0"
description = "Agentic simulation of AI preferences for competing digital media of exchange"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "e2b>=2.0",
]

[project.optional-dependencies]
# Not required for Phase 1 core simulation -- only needed for the optional
# integrations in metrics/wandb_logger.py and scripts/calibrate_currency_configs.py.
observability = ["wandb>=0.17"]
market-data = ["requests>=2.31"]
# Phase 2: OpenRouter (src/llm/llm_router.py) and Polygon
# (src/llm/market_intelligence.py) both go over HTTP via httpx.
llm = ["httpx>=0.27"]
# Phase 3 Plan 5: the H1-H5 hypothesis regression engine (src/econometrics/).
econometrics = ["statsmodels>=0.14"]
# Phase 3 dashboard (dashboard/): Streamlit UI plus psutil for cross-platform
# subprocess liveness checks in dashboard/process_control.py.
dashboard = ["streamlit>=1.36", "psutil>=6.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["src*", "database*", "sandbox*", "metrics*", "dashboard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: hits a real external API (OpenRouter); requires RUN_LIVE_LLM_TESTS=1 to run"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
