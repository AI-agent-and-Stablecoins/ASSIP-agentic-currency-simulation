# Full ~99-model candidate roster for Phase 3 Plan 3's per-agent model
# assignment, translated from the user-supplied "Phase 4 Model List.md"
# (human-readable vendor/model names, no OpenRouter IDs of its own).
#
# `id` is a best-effort OpenRouter model ID guess using the standard
# vendor-prefix/model-slug convention. These are expected to be imperfect --
# some listed models are prior-generation and may be deprecated/renamed on
# OpenRouter by run time. This is not a bug to fix by further hand-tuning:
# src/llm/llm_router.py's verify_model_candidates() checks every `id` here
# against OpenRouter's live /models endpoint before assignment, excludes any
# that don't resolve, and reports the exclusions -- see
# docs/superpowers/specs/2026-07-30-phase3-plan3-agent-population-design.md
# Sec 2.4.
#
# `name` is preserved verbatim from the source list for reporting purposes
# (so an excluded candidate can be reported by its human-readable name, not
# just a guessed ID string).

